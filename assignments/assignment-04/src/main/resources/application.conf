pekko {
  actor.provider = cluster
  remote.artery {
    canonical.hostname = "127.0.0.1"
    canonical.port = 0
  }
  cluster {
    seed-nodes = [
      "pekko://smart-home@127.0.0.1:2551",
      "pekko://smart-home@127.0.0.1:2552"
    ]
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
  }
  actor.serialization-bindings {
    "pcd.assignment04.cluster.ClusterMessage" = jackson-json
  }
}
